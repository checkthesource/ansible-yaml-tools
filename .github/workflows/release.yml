# Publishes the collection to Ansible Galaxy when a version tag (v1.2.3) is pushed.
#
# Security design:
# - The Galaxy token lives in the "galaxy" environment, not in repository secrets.
#   Restrict that environment to v* tags and require a reviewer (see README).
# - Only the "publish" job can read the token, and it never checks out or runs
#   repository code: it only installs ansible-core and uploads the tarball that
#   was built and tested by the previous jobs.
# - Every job gets the minimum GITHUB_TOKEN permissions, and third-party code is
#   limited to GitHub's own actions, pinned by commit SHA.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  COLLECTION_PATH: ansible_collections/checkthesource/yaml_tools

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ${{ env.COLLECTION_PATH }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ansible-core ruamel.yaml pytest
      - name: Unit tests
        run: python -m pytest tests/unit
        working-directory: ${{ env.COLLECTION_PATH }}
      - name: Sanity tests
        run: ansible-test sanity --docker --color
        working-directory: ${{ env.COLLECTION_PATH }}

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ansible-core
        run: pip install ansible-core
      - name: Check that the tag matches galaxy.yml
        run: |
          version=$(python -c 'import yaml; print(yaml.safe_load(open("galaxy.yml"))["version"])')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in galaxy.yml"
            exit 1
          fi
      - name: Build the collection
        run: |
          ansible-galaxy collection build --output-path dist/
          sha256sum dist/*.tar.gz | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: collection
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to Ansible Galaxy
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: galaxy
      url: https://galaxy.ansible.com/ui/repo/published/checkthesource/yaml_tools/
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ansible-core
        run: pip install ansible-core
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: collection
          path: dist/
      - name: Verify the checksum
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Publish
        # The token is passed through ansible-galaxy's own configuration
        # variables, so it never appears on a command line.
        env:
          ANSIBLE_GALAXY_SERVER_LIST: release_galaxy
          ANSIBLE_GALAXY_SERVER_RELEASE_GALAXY_URL: https://galaxy.ansible.com/
          ANSIBLE_GALAXY_SERVER_RELEASE_GALAXY_TOKEN: ${{ secrets.GALAXY_API_KEY }}
        run: ansible-galaxy collection publish dist/*.tar.gz

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: collection
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
