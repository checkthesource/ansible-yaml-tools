name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  COLLECTION_PATH: ansible_collections/checkthesource/yaml_tools

jobs:
  lint:
    name: Lint (ansible-lint, changelog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ${{ env.COLLECTION_PATH }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install tools
        run: pip install ansible-core ansible-lint antsibull-changelog
      - name: Run ansible-lint
        run: ansible-lint --profile production
        working-directory: ${{ env.COLLECTION_PATH }}
      - name: Check changelog fragments
        run: antsibull-changelog lint
        working-directory: ${{ env.COLLECTION_PATH }}

  unit:
    # Runs in the official Python images, because GitHub's runners no longer
    # ship old Python versions. Python 3.6 is the default (platform) Python of
    # RHEL 8 managed nodes, Python 3.9 the default of RHEL 9.
    name: Unit tests (Python ${{ matrix.python }}, ruamel.yaml ${{ matrix.ruamel }})
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.6", "3.9", "3.11", "3.13"]
        ruamel: ["0.17.*", "0.18.*", "latest"]
        exclude:
          - python: "3.13"
            ruamel: "0.17.*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        # pip picks the newest ansible-core that supports this Python. The tests
        # only use its module_utils, which are the same on managed nodes.
        run: |
          if [ "${{ matrix.ruamel }}" = "latest" ]; then
            pip install ruamel.yaml
          else
            pip install "ruamel.yaml==${{ matrix.ruamel }}"
          fi
          pip install ansible-core pytest
      - name: Run unit tests
        run: python -m pytest -v tests/unit

  sanity:
    name: Sanity (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each ansible-core release supports a different range of Python
        # versions on the controller.
        include:
          - ansible: stable-2.16
            python: "3.12"
          - ansible: stable-2.17
            python: "3.12"
          - ansible: stable-2.19
            python: "3.13"
          - ansible: stable-2.21
            python: "3.13"
          - ansible: stable-2.22
            python: "3.13"
          - ansible: devel
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ${{ env.COLLECTION_PATH }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install ansible-core
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz
      - name: Run sanity tests
        # --local instead of --docker: the ansible-test containers cannot start
        # on the current GitHub runners (cgroup remount fails).
        run: ansible-test sanity --local --python ${{ matrix.python }} --requirements -v --color
        working-directory: ${{ env.COLLECTION_PATH }}

  integration:
    name: Integration (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible: stable-2.16
            python: "3.12"
          - ansible: stable-2.17
            python: "3.12"
          - ansible: stable-2.19
            python: "3.13"
          - ansible: stable-2.21
            python: "3.13"
          - ansible: stable-2.22
            python: "3.13"
          - ansible: devel
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ${{ env.COLLECTION_PATH }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz
          pip install -r ${{ env.COLLECTION_PATH }}/requirements.txt
      - name: Run integration tests
        run: ansible-test integration -v --color --local --python ${{ matrix.python }}
        working-directory: ${{ env.COLLECTION_PATH }}
